<div class="login-container" style="max-width: 400px; margin: 2rem auto; padding: 2rem; border: 1px solid #ddd; border-radius: 8px;">
  <h2>{{ 'user.login.title' | i18n }}</h2>
  
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <div class="form-group" style="margin-bottom: 1rem;">
      <label>{{ 'user.login.username' | i18n }}</label>
      <input 
        type="text" 
        class="form-control" 
        [(ngModel)]="username" 
        name="username"
        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label>{{ 'user.login.password' | i18n }}</label>
      <input 
        type="password" 
        class="form-control" 
        [(ngModel)]="password" 
        name="password"
        style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
    </div>

    <div class="form-check" style="margin-bottom: 1rem;">
      <input 
        type="checkbox" 
        class="form-check-input" 
        [(ngModel)]="rememberMe" 
        name="rememberMe"
        id="rememberMe">
      <label class="form-check-label" for="rememberMe" style="margin-left: 0.5rem;">
        {{ 'user.login.remember' | i18n }}
      </label>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger" style="padding: 0.5rem; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; margin-bottom: 1rem; color: #721c24;">
      {{ errorMessage }}
    </div>

    <button 
      type="submit" 
      class="btn btn-primary" 
      [disabled]="loading"
      style="width: 100%; padding: 0.5rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      {{ loading ? ('common.message.loading' | i18n) : ('user.login.loginBtn' | i18n) }}
    </button>

    <div class="links" style="margin-top: 1rem; text-align: center;">
      <a (click)="forgotPassword()" style="color: #007bff; cursor: pointer; margin-right: 1rem;">
        {{ 'user.login.forgotPassword' | i18n }}
      </a>
      <span>{{ 'user.login.noAccount' | i18n }}</span>
      <a href="#" style="color: #007bff; margin-left: 0.5rem;">{{ 'user.login.signUp' | i18n }}</a>
    </div>
  </form>
</div>
